<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" style="max-width:100%;height:auto" role="group" aria-labelledby="tm-title tm-desc" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title id="tm-title">The path from electricity to radio, as a transit map</title>
<desc id="tm-desc">A transit map of the path from electricity to radio. The amber Foundations line on Exploring Electronics runs through stops 1 to 9: conductors, prefixes, voltage, current, resistance, Ohm's law, fuses, series and parallel, and batteries. At Ohm's law the purple AC and fields line branches off through stops 10 to 13: AC vs DC, magnetism, capacitors, and inductors. At series and parallel the green Components line branches off through stops 14 to 18: resistor types, diodes and LEDs, transistors, vacuum tubes, and voltage regulators. The purple and green lines meet at the Radio Fundamentals interchange, where the blue Radio line on this site begins, running on to antennas and feedlines, propagation, and on the air. Every written stop is a link to its article.</desc>
<style>.tm-stop .tm-ring{stroke:#1a202c;stroke-width:3;transition:stroke .15s}.tm-stop:hover .tm-ring,.tm-stop:focus-visible .tm-ring{stroke:#ffffff;stroke-width:4}.tm-stop:hover .tm-lbl,.tm-stop:focus-visible .tm-lbl{fill:#ffffff;text-decoration:underline}.tm-stop:focus{outline:none}</style>
