<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A tree with the Radiocommunication Act at its root, where offences and penalties live. One branch: the Governor in Council, the federal Cabinet, makes the Radiocommunication Regulations under section 6; they define the amateur radio service, who may operate and what may be sent. The other branch: the Minister, through ISED, under section 5(1), establishes standards such as RBR-4 and RIC-3, issues certificates and appoints inspectors.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Every amateur rule traces back to one Act</text>
<ellipse cx="467.5" cy="155.0" rx="173.5" ry="9.0" fill="#000" fill-opacity="0.4"/>
<polygon points="300.0,105.0 600.0,105.0 635.0,82.5 335.0,82.5" fill="#bba1f0"/>
<rect x="300.0" y="105.0" width="300.0" height="45.0" fill="#9f7aea"/>
<rect x="300.0" y="105.0" width="300.0" height="45.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="600.0,150.0 600.0,105.0 635.0,82.5 635.0,127.5" fill="#574380"/>
<text x="450.0" y="128.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Radiocommunication Act</text>
<text x="450.0" y="172.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">offences and penalties live here</text>
<path d="M 450.0 185 L 450.0 215 L 230 215 L 230 245" fill="none" stroke="#a0aec0" stroke-width="2.5"/>
<text x="230.0" y="262.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">Governor in Council</text>
<text x="230.0" y="280.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">(the federal Cabinet), s. 6</text>
