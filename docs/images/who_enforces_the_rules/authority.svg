<text x="230.0" y="340.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Radiocommunication Regulations</text>
<text x="230.0" y="392.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">define the amateur radio service</text>
<text x="230.0" y="414.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">who may operate; what may be sent</text>
<path d="M 450.0 185 L 450.0 215 L 670 215 L 670 245" fill="none" stroke="#a0aec0" stroke-width="2.5"/>
<text x="670.0" y="262.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">the Minister, through ISED</text>
<text x="670.0" y="280.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">s. 5(1)</text>
<ellipse cx="685.8" cy="365.0" rx="161.8" ry="8.1" fill="#000" fill-opacity="0.4"/>
<polygon points="530.0,320.0 810.0,320.0 841.5,299.8 561.5,299.8" fill="#73c9c4"/>
<rect x="530.0" y="320.0" width="280.0" height="40.0" fill="#38b2ac"/>
<rect x="530.0" y="320.0" width="280.0" height="40.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="810.0,360.0 810.0,320.0 841.5,299.8 841.5,339.8" fill="#1e615e"/>
<text x="670.0" y="340.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Standards, certificates, inspectors</text>
<text x="670.0" y="392.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">RBR-4 and RIC-3 (s. 5(1)(d))</text>
<text x="670.0" y="414.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">issues certificates; appoints inspectors</text>
