<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A radio wave drawn in three dimensions. A red sine wave, the electric field, oscillates in the vertical plane; a blue sine wave, the magnetic field, oscillates in the horizontal plane at right angles to it. Both travel together along an axis marked direction of travel. A bracket over one crest-to-crest cycle marks one wavelength. The two fields are at right angles to each other and to the direction of travel, and move at the speed of light.</title>
