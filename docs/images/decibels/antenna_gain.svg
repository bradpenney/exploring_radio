<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two radiation patterns. An isotropic radiator, an ideal point radiating equally in every direction, has 0 dBi. A half-wave dipole, drawn vertically, pulls energy from its ends into its sides, forming a figure-eight pattern that reaches 2.15 dB beyond the isotropic circle: 2.15 dBi, which is 0 dBd. So dBi equals dBd plus 2.15.</title>
