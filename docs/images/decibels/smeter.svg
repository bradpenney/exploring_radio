<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>An S-meter dial marked S1 to S9 in black, then plus 20, plus 40 and plus 60 dB over S9 in red, with the needle at S9. One S-unit is 6 dB, four times the power. A station heard at S9 with 100 watts reads S8 at 25 watts; one heard at 20 dB over S9 with 150 watts reads 10 dB over S9 at 15 watts.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="430" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">An S-meter: 6 dB per S-unit up to S9, then dB over S9</text>
<path d="M 200 330 A 250 250 0 0 1 700 330 Z" fill="#f5ecd5" stroke="#5a4a2a" stroke-width="3"/>
<line x1="243.1" y1="283.8" x2="225.5" y2="279.8" stroke="#222" stroke-width="3"/>
<text x="266.5" y="294.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">S1</text>
<line x1="266.0" y1="224.6" x2="250.4" y2="215.7" stroke="#222" stroke-width="3"/>
<text x="286.9" y="241.6" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">S3</text>
<line x1="305.4" y1="175.0" x2="293.1" y2="161.8" stroke="#222" stroke-width="3"/>
<text x="321.8" y="197.5" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">S5</text>
<line x1="357.7" y1="139.1" x2="349.9" y2="122.9" stroke="#222" stroke-width="3"/>
<text x="368.2" y="165.7" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">S7</text>
<line x1="418.3" y1="120.4" x2="415.6" y2="102.6" stroke="#222" stroke-width="3"/>
<text x="421.9" y="149.1" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">S9</text>
<line x1="522.7" y1="130.9" x2="528.9" y2="114.0" stroke="#c53030" stroke-width="3"/>
<text x="514.5" y="158.4" font-size="15" fill="#c53030" text-anchor="middle" font-weight="bold">+20</text>
<line x1="609.3" y1="190.2" x2="622.9" y2="178.3" stroke="#c53030" stroke-width="3"/>
<text x="591.3" y="211.0" font-size="15" fill="#c53030" text-anchor="middle" font-weight="bold">+40</text>
<line x1="656.9" y1="283.8" x2="674.5" y2="279.8" stroke="#c53030" stroke-width="3"/>
<text x="633.5" y="294.0" font-size="15" fill="#c53030" text-anchor="middle" font-weight="bold">+60</text>
<line x1="244.9" y1="250.4" x2="235.6" y2="246.8" stroke="#222" stroke-width="2"/>
<line x1="277.6" y1="193.3" x2="269.8" y2="187.1" stroke="#222" stroke-width="2"/>
<line x1="325.7" y1="148.5" x2="320.1" y2="140.2" stroke="#222" stroke-width="2"/>
<line x1="384.9" y1="119.8" x2="382.0" y2="110.3" stroke="#222" stroke-width="2"/>
<path d="M 415.6 102.6 A 230 230 0 0 1 680.0 330.0" fill="none" stroke="#c53030" stroke-width="5" opacity="0.6"/>
<line x1="450" y1="330" x2="420.1" y2="132.2" stroke="#1a202c" stroke-width="4"/>
<circle cx="450" cy="330" r="12" fill="#1a202c"/>
<text x="450.0" y="290.0" font-size="20" fill="#1a202c" text-anchor="middle" font-weight="bold">S9</text>
<text x="450.0" y="370.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">one S-unit = 6 dB = ×4 power</text>
<text x="450.0" y="392.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">S9 at 100 W becomes S8 at 25 W; "20 dB over S9" at 150 W becomes "10 over" at 15 W</text>
</svg>
