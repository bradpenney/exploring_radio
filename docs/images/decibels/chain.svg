<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two signal chains. A 2 watt handheld feeds an amplifier with plus 9 dB of gain, which is times 8, giving 16 watts. A 100 watt transmitter feeds a feedline with 6 dB of loss, which is divide by 4, leaving 25 watts at the antenna. With several stages, add their decibels first, for example plus 20 minus 3 minus 2 is plus 15 dB, then convert once.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">In decibels, a chain of gains and losses just adds up</text>
<ellipse cx="157.6" cy="180.0" rx="93.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="70.0,129.0 220.0,129.0 245.2,112.8 95.2,112.8" fill="#7ab7ea"/>
<rect x="70.0" y="129.0" width="150.0" height="46.0" fill="#4299e1"/>
<rect x="70.0" y="129.0" width="150.0" height="46.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="220.0,175.0 220.0,129.0 245.2,112.8 245.2,158.8" fill="#24547b"/>
<text x="145.0" y="157.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">handheld</text>
<text x="145.0" y="199.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">2 W</text>
<line x1="245" y1="150" x2="330" y2="150" stroke="#a0aec0" stroke-width="3"/>
<path d="M 340 150 l -12 -7 l 0 14 z" fill="#a0aec0"/>
<ellipse cx="442.6" cy="180.0" rx="103.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="345.0,129.0 515.0,129.0 540.2,112.8 370.2,112.8" fill="#7ecfa0"/>
<rect x="345.0" y="129.0" width="170.0" height="46.0" fill="#48bb78"/>
<rect x="345.0" y="129.0" width="170.0" height="46.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="515.0,175.0 515.0,129.0 540.2,112.8 540.2,158.8" fill="#276642"/>
<text x="430.0" y="157.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">amplifier</text>
<text x="430.0" y="199.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">+9 dB = ×8</text>
<line x1="540" y1="150" x2="630" y2="150" stroke="#a0aec0" stroke-width="3"/>
<path d="M 640 150 l -12 -7 l 0 14 z" fill="#a0aec0"/>
<rect x="670.0" y="127.0" width="130" height="40" rx="20.0" fill="#48bb78"/>
<rect x="670.0" y="127.0" width="130" height="40" rx="20.0" fill="url(#gloss)"/>
<text x="735.0" y="153.1" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">16 W</text>
<text x="735.0" y="195.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">2 × 8 = 16</text>
<ellipse cx="157.6" cy="350.0" rx="93.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="70.0,299.0 220.0,299.0 245.2,282.8 95.2,282.8" fill="#f8bb54"/>
<rect x="70.0" y="299.0" width="150.0" height="46.0" fill="#f59e0b"/>
<rect x="70.0" y="299.0" width="150.0" height="46.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="220.0,345.0 220.0,299.0 245.2,282.8 245.2,328.8" fill="#865606"/>
<text x="145.0" y="327.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">transmitter</text>
<text x="145.0" y="369.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">100 W</text>
<line x1="245" y1="320" x2="330" y2="320" stroke="#a0aec0" stroke-width="3"/>
<path d="M 340 320 l -12 -7 l 0 14 z" fill="#a0aec0"/>
<ellipse cx="442.6" cy="350.0" rx="103.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="345.0,299.0 515.0,299.0 540.2,282.8 370.2,282.8" fill="#fca6a6"/>
<rect x="345.0" y="299.0" width="170.0" height="46.0" fill="#fc8181"/>
<rect x="345.0" y="299.0" width="170.0" height="46.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="515.0,345.0 515.0,299.0 540.2,282.8 540.2,328.8" fill="#8a4646"/>
<text x="430.0" y="327.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">feedline</text>
<text x="430.0" y="369.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">−6 dB = ÷4</text>
<line x1="540" y1="320" x2="630" y2="320" stroke="#a0aec0" stroke-width="3"/>
<path d="M 640 320 l -12 -7 l 0 14 z" fill="#a0aec0"/>
<rect x="630.0" y="297.0" width="210" height="40" rx="20.0" fill="#fc8181"/>
<rect x="630.0" y="297.0" width="210" height="40" rx="20.0" fill="url(#gloss)"/>
<text x="735.0" y="322.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">25 W at the antenna</text>
<text x="735.0" y="365.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">100 ÷ 4 = 25</text>
<text x="450.0" y="405.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">With several stages, add their dB first (+20 − 3 − 2 = +15 dB), then convert once.</text>
</svg>
