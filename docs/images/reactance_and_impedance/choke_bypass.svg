<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two panels comparing a 1 millihenry choke in series and a 10 nanofarad bypass capacitor to ground, on a log scale. At 1 kilohertz, audio: the choke is 6.3 ohms, low, so audio passes, and the bypass capacitor is 16 kilohms, high, so audio stays on the line; audio reaches the amplifier. At 7 megahertz, RF: the choke is 44 kilohms, high, so RF is blocked, and the capacitor is 2.3 ohms, low, so RF is shunted to ground; RF never gets there.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="425" height="420" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<rect x="460" y="15" width="425" height="420" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="227.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">At 1 kHz (audio)</text>
<ellipse cx="142.2" cy="325.0" rx="63.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="85.0,270.4 175.0,270.4 199.5,254.7 109.5,254.7" fill="#f8bb54"/>
<rect x="85.0" y="270.4" width="90.0" height="49.6" fill="#f59e0b"/>
<rect x="85.0" y="270.4" width="90.0" height="49.6" fill="url(#gloss)" opacity="0.6"/>
<polygon points="175.0,320.0 175.0,270.4 199.5,254.7 199.5,304.2" fill="#865606"/>
<text x="140.0" y="246.4" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">6.3 Ω</text>
<text x="130.0" y="344.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">choke</text>
<text x="130.0" y="362.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">in series: low, audio passes</text>
<ellipse cx="302.2" cy="325.0" rx="63.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="245.0,140.5 335.0,140.5 359.5,124.7 269.5,124.7" fill="#7ab7ea"/>
<rect x="245.0" y="140.5" width="90.0" height="179.5" fill="#4299e1"/>
<rect x="245.0" y="140.5" width="90.0" height="179.5" fill="url(#gloss)" opacity="0.6"/>
<polygon points="335.0,320.0 335.0,140.5 359.5,124.7 359.5,304.2" fill="#24547b"/>
<text x="300.0" y="116.5" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">16 kΩ</text>
<text x="290.0" y="344.0" font-size="13" fill="#4299e1" text-anchor="middle" font-weight="bold">bypass</text>
<text x="290.0" y="362.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">to ground: high, audio stays</text>
<rect x="97.0" y="380.0" width="260" height="30" rx="15.0" fill="#48bb78"/>
<rect x="97.0" y="380.0" width="260" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="227.0" y="399.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">audio reaches the amplifier</text>
<text x="672.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">At 7 MHz (RF)</text>
<ellipse cx="587.2" cy="325.0" rx="63.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="530.0,123.6 620.0,123.6 644.5,107.9 554.5,107.9" fill="#f8bb54"/>
<rect x="530.0" y="123.6" width="90.0" height="196.4" fill="#f59e0b"/>
<rect x="530.0" y="123.6" width="90.0" height="196.4" fill="url(#gloss)" opacity="0.6"/>
<polygon points="620.0,320.0 620.0,123.6 644.5,107.9 644.5,304.2" fill="#865606"/>
<text x="585.0" y="99.6" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">44 kΩ</text>
<text x="575.0" y="344.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">choke</text>
<text x="575.0" y="362.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">in series: high, RF blocked</text>
<ellipse cx="747.2" cy="325.0" rx="63.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="690.0,287.3 780.0,287.3 804.5,271.5 714.5,271.5" fill="#7ab7ea"/>
<rect x="690.0" y="287.3" width="90.0" height="32.7" fill="#4299e1"/>
<rect x="690.0" y="287.3" width="90.0" height="32.7" fill="url(#gloss)" opacity="0.6"/>
<polygon points="780.0,320.0 780.0,287.3 804.5,271.5 804.5,304.2" fill="#24547b"/>
<text x="745.0" y="263.3" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">2.3 Ω</text>
<text x="735.0" y="344.0" font-size="13" fill="#4299e1" text-anchor="middle" font-weight="bold">bypass</text>
<text x="735.0" y="362.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">to ground: low, RF shunted</text>
<rect x="542.0" y="380.0" width="260" height="30" rx="15.0" fill="#fc8181"/>
<rect x="542.0" y="380.0" width="260" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="672.0" y="399.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">RF never gets there</text>
</svg>
