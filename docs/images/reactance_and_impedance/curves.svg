<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A log-log graph of reactance against frequency from 100 hertz to 100 megahertz. The reactance of a 1 millihenry inductor rises in a straight line, from about 6 ohms at 1 kilohertz to about 44 kilohms at 7 megahertz. The reactance of a 10 nanofarad capacitor falls in a straight line, from about 16 kilohms at 1 kilohertz to about 2 ohms at 7 megahertz. The audio range and the HF range are shaded. The two lines cross near 50 kilohertz. Ten times the frequency gives ten times the inductor's reactance and a tenth of the capacitor's.</title>
