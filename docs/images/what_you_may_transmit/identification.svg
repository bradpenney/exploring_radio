<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A timeline of a 75-minute contact with the call sign sent at the start, at 30 minutes, at 60 minutes, and at the end: at the beginning and end of each exchange or test, and at intervals of no more than 30 minutes, each station sending its own call sign in English or French.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="300" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">A 75-minute contact: when the call sign must be sent (RBR-4 section 9)</text>
<rect x="90" y="156" width="720" height="28" rx="14" fill="#2d3748"/>
<rect x="90" y="156" width="720" height="28" rx="14" fill="#4299e1" fill-opacity="0.35"/>
<circle cx="90.0" cy="170" r="16" fill="url(#vball)"/>
<text x="90.0" y="175.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">ID</text>
<text x="90.0" y="212.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">start</text>
<circle cx="378.0" cy="170" r="16" fill="url(#vball)"/>
<text x="378.0" y="175.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">ID</text>
<text x="378.0" y="212.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">30 min</text>
<circle cx="666.0" cy="170" r="16" fill="url(#vball)"/>
<text x="666.0" y="175.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">ID</text>
<text x="666.0" y="212.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">60 min</text>
<circle cx="810.0" cy="170" r="16" fill="url(#vball)"/>
<text x="810.0" y="175.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">ID</text>
<text x="810.0" y="212.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">end</text>
<text x="90.0" y="144.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">0</text>
<text x="234.0" y="144.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">15</text>
<text x="378.0" y="144.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">30</text>
<text x="522.0" y="144.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">45</text>
<text x="666.0" y="144.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">60</text>
<text x="810.0" y="144.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">75</text>
<text x="450.0" y="262.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">at the beginning and end of each exchange or test, and at intervals of no more than 30 minutes</text>
<text x="450.0" y="284.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">each station sends its own call sign, in English or French</text>
</svg>
