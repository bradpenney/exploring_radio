<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Six steps along a line. 1: study the public 984-question bank. 2: find an accredited examiner, in person or by video. 3: write the Basic exam, 100 questions, 70 percent to pass. 4: the examiner submits your results to ISED within ten working days. 5: create your ISED account with the authorization key from your examiner, choosing a call sign. 6: your certificate and call sign, valid for life.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="370" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">From studying to transmitting: the route to a certificate</text>
<rect x="80" y="214" width="740" height="12" rx="6" fill="#4a5568"/>
<circle cx="90" cy="220" r="22" fill="#4299e1"/>
<circle cx="90" cy="220" r="22" fill="url(#gloss)" opacity="0.5"/>
<text x="90.0" y="226.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="90.0" y="128.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Study</text>
<text x="90.0" y="146.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">the 984-question</text>
<text x="90.0" y="166.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">public bank</text>
<circle cx="234" cy="220" r="22" fill="#4299e1"/>
<circle cx="234" cy="220" r="22" fill="url(#gloss)" opacity="0.5"/>
<text x="234.0" y="226.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="234.0" y="278.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Find an</text>
<text x="234.0" y="296.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">accredited examiner</text>
<text x="234.0" y="316.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">(in person or video)</text>
<circle cx="378" cy="220" r="22" fill="url(#vball)"/>
<circle cx="378" cy="220" r="22" fill="url(#gloss)" opacity="0.5"/>
<text x="378.0" y="226.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">3</text>
<text x="378.0" y="128.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Write the</text>
<text x="378.0" y="146.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Basic exam</text>
<text x="378.0" y="166.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">100 questions, 70% to pass</text>
<circle cx="522" cy="220" r="22" fill="#9f7aea"/>
<circle cx="522" cy="220" r="22" fill="url(#gloss)" opacity="0.5"/>
<text x="522.0" y="226.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="522.0" y="278.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Examiner</text>
<text x="522.0" y="296.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">submits results</text>
<text x="522.0" y="316.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">within 10 working days</text>
<circle cx="666" cy="220" r="22" fill="#9f7aea"/>
<circle cx="666" cy="220" r="22" fill="url(#gloss)" opacity="0.5"/>
<text x="666.0" y="226.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="666.0" y="128.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Create your</text>
<text x="666.0" y="146.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">ISED account</text>
<text x="666.0" y="166.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">with your authorization key</text>
<circle cx="810" cy="220" r="22" fill="#48bb78"/>
<circle cx="810" cy="220" r="22" fill="url(#gloss)" opacity="0.5"/>
<text x="810.0" y="226.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="810.0" y="278.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Certificate</text>
<text x="810.0" y="296.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">and call sign</text>
<text x="810.0" y="316.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">valid for life</text>
</svg>
