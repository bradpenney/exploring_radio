<rect x="292.0" y="95.0" width="90.0" height="50.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="382.0,145.0 382.0,95.0 406.5,79.2 406.5,129.2" fill="#574380"/>
<text x="337.0" y="182.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">minimum</text>
<rect x="252.0" y="193.0" width="170" height="28" rx="14.0" fill="#9f7aea"/>
<rect x="252.0" y="193.0" width="170" height="28" rx="14.0" fill="url(#gloss)"/>
<text x="337.0" y="211.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Basic + Advanced</text>
<text x="337.0" y="256.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">permit from Radio</text>
<text x="337.0" y="280.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Amateurs of Canada</text>
<text x="337.0" y="304.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">host country's rules</text>
<text x="337.0" y="328.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">apply</text>
<text x="337.0" y="352.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">ID: host prefix,</text>
<text x="337.0" y="376.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">then "stroke" + call</text>
<rect x="455" y="15" width="205" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="557.0" y="50.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">IARP (Americas)</text>
<ellipse cx="569.2" cy="150.0" rx="63.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="512.0,95.0 602.0,95.0 626.5,79.2 536.5,79.2" fill="#73c9c4"/>
<rect x="512.0" y="95.0" width="90.0" height="50.0" fill="#38b2ac"/>
<rect x="512.0" y="95.0" width="90.0" height="50.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="602.0,145.0 602.0,95.0 626.5,79.2 626.5,129.2" fill="#1e615e"/>
<text x="557.0" y="182.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">minimum</text>
<rect x="472.0" y="193.0" width="170" height="28" rx="14.0" fill="#38b2ac"/>
<rect x="472.0" y="193.0" width="170" height="28" rx="14.0" fill="url(#gloss)"/>
<text x="557.0" y="211.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Basic</text>
<text x="557.0" y="256.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">permit from Radio</text>
<text x="557.0" y="280.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Amateurs of Canada</text>
<text x="557.0" y="304.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Class 2 (Basic):</text>
<text x="557.0" y="328.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">above 30 MHz only</text>
<text x="557.0" y="352.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Class 1 needs</text>
<text x="557.0" y="376.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Morse (12 w.p.m.)</text>
<rect x="675" y="15" width="205" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="777.0" y="50.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">Anywhere else</text>
<ellipse cx="789.2" cy="150.0" rx="63.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="732.0,95.0 822.0,95.0 846.5,79.2 756.5,79.2" fill="#bcc6d2"/>
