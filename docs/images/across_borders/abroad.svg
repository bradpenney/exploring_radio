<text x="117.0" y="182.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">minimum</text>
<rect x="32.0" y="193.0" width="170" height="28" rx="14.0" fill="#4299e1"/>
<rect x="32.0" y="193.0" width="170" height="28" rx="14.0" fill="url(#gloss)"/>
<text x="117.0" y="211.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Basic</text>
<text x="117.0" y="256.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">no permit; carry your</text>
<text x="117.0" y="280.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">certificate</text>
<text x="117.0" y="304.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">US band edges and</text>
<text x="117.0" y="328.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">mode rules apply</text>
<text x="117.0" y="352.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">ID: call sign, then</text>
<text x="117.0" y="376.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">"portable" + US area</text>
<rect x="235" y="15" width="205" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="337.0" y="50.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">CEPT countries</text>
