<rect x="732.0" y="95.0" width="90.0" height="50.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="822.0,145.0 822.0,95.0 846.5,79.2 846.5,129.2" fill="#585f69"/>
<text x="777.0" y="182.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">minimum</text>
<rect x="692.0" y="193.0" width="170" height="28" rx="14.0" fill="#4a5568"/>
<rect x="692.0" y="193.0" width="170" height="28" rx="14.0" fill="url(#gloss)"/>
<text x="777.0" y="211.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">ask first</text>
<text x="777.0" y="256.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">contact the country's</text>
<text x="777.0" y="280.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">administration well</text>
<text x="777.0" y="304.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">in advance</text>
<text x="777.0" y="328.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal"></text>
<text x="777.0" y="352.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">its rules, its</text>
<text x="777.0" y="376.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">conditions</text>
<text x="450.0" y="408.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">Outside Canada you follow the host country's rules (RBR-4 s. 7; RIC-3 s. 8).</text>
<text x="450.0" y="426.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">A Canadian-issued CEPT permit or IARP has no legal status in Canada.</text>
</svg>
