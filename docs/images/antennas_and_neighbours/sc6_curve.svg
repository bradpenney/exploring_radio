<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A graph of the Safety Code 6 electric-field reference level for uncontrolled environments, from 20 megahertz to 6 gigahertz on a logarithmic scale. The limit falls from about 27 volts per metre at 20 megahertz to a flat minimum of 22.06 volts per metre from 48 to 300 megahertz, highlighted as the lowest limit, then rises to about 61 volts per metre at 6 gigahertz. Amateur bands are marked: 10 metres, 6 metres, 2 metres, 1.25 metres, 70 centimetres and 33 centimetres; 6, 2 and 1.25 metres fall in the lowest-limit range. Limits are field strengths at the person, whatever the source, and no transmitter is exempt.</title>
