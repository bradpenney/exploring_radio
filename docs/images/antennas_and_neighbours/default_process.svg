<line x1="260" y1="180" x2="370" y2="300" stroke="#a0aec0" stroke-width="1"/>
<path d="M 260 308 L 460 308" stroke="#fbbf24" stroke-width="2"/>
<text x="360.0" y="328.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold">3 × tower height</text>
<text x="272.0" y="125.0" font-size="11" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">tower height h</text>
<ellipse cx="134.7" cy="295.0" rx="30.7" ry="5.0" fill="#000" fill-opacity="0.4"/>
<polygon points="110.0,268.0 144.0,268.0 159.4,258.1 125.4,258.1" fill="#7ab7ea"/>
