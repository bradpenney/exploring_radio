<rect x="380.0" y="248.0" width="34.0" height="22.0" fill="#4299e1"/>
<rect x="380.0" y="248.0" width="34.0" height="22.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="414.0,270.0 414.0,248.0 429.4,238.1 429.4,260.1" fill="#24547b"/>
<ellipse cx="224.7" cy="345.0" rx="30.7" ry="5.0" fill="#000" fill-opacity="0.4"/>
<polygon points="200.0,318.0 234.0,318.0 249.4,308.1 215.4,308.1" fill="#7ab7ea"/>
<rect x="200.0" y="318.0" width="34.0" height="22.0" fill="#4299e1"/>
<rect x="200.0" y="318.0" width="34.0" height="22.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="234.0,340.0 234.0,318.0 249.4,308.1 249.4,330.1" fill="#24547b"/>
<ellipse cx="514.7" cy="255.0" rx="30.7" ry="5.0" fill="#000" fill-opacity="0.4"/>
<polygon points="490.0,228.0 524.0,228.0 539.4,218.1 505.4,218.1" fill="#808895"/>
<rect x="490.0" y="228.0" width="34.0" height="22.0" fill="#4a5568"/>
<rect x="490.0" y="228.0" width="34.0" height="22.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="524.0,250.0 524.0,228.0 539.4,218.1 539.4,240.1" fill="#282e39"/>
<text x="507.0" y="215.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">outside</text>
<text x="260.0" y="395.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">notify everyone inside, by mail or by hand</text>
<rect x="543.0" y="93.0" width="34" height="34" rx="17.0" fill="#38b2ac"/>
<rect x="543.0" y="93.0" width="34" height="34" rx="17.0" fill="url(#gloss)"/>
<text x="560.0" y="115.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="590.0" y="115.0" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="bold">Notify</text>
<text x="590.0" y="138.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">public, land-use authority and ISED;</text>
<text x="590.0" y="156.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">at least 30 days for written comments</text>
<rect x="543.0" y="188.0" width="34" height="34" rx="17.0" fill="#38b2ac"/>
<rect x="543.0" y="188.0" width="34" height="34" rx="17.0" fill="url(#gloss)"/>
<text x="560.0" y="210.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="590.0" y="210.0" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="bold">Respond</text>
<text x="590.0" y="233.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">acknowledge within 14 days; address</text>
<text x="590.0" y="251.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">reasonable and relevant concerns within 60</text>
<rect x="543.0" y="283.0" width="34" height="34" rx="17.0" fill="#38b2ac"/>
<rect x="543.0" y="283.0" width="34" height="34" rx="17.0" fill="url(#gloss)"/>
<text x="560.0" y="305.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="590.0" y="305.0" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="bold">Reply</text>
<text x="590.0" y="328.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">the public has 21 days to reply;</text>
<text x="590.0" y="346.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">copies go to ISED</text>
</svg>
