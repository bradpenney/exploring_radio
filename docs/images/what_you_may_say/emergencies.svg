<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three panels. Distress: a station in distress may use any means of radiocommunication, under ITU Radio Regulations 4.9, with no power limit, on any band, and anyone may answer. Emergency or disaster: amateur stations only, carrying messages for people, governments or relief organizations, under section 48 of the Regulations, in real or simulated emergencies. Everyone else: keep the net frequency clear and avoid needless transmissions on or near it; false distress calls are an offence under section 9(1)(a) of the Act.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="280" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<ellipse cx="165.5" cy="155.0" rx="66.5" ry="5.4" fill="#000" fill-opacity="0.4"/>
<polygon points="105.0,80.0 205.0,80.0 226.0,66.5 126.0,66.5" fill="#fca6a6"/>
<rect x="105.0" y="80.0" width="100.0" height="70.0" fill="#fc8181"/>
<rect x="105.0" y="80.0" width="100.0" height="70.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="205.0,150.0 205.0,80.0 226.0,66.5 226.0,136.5" fill="#8a4646"/>
<text x="155.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Distress</text>
<text x="155.0" y="200.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">a station in distress may use</text>
<text x="155.0" y="224.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">any means of radiocommunication</text>
<text x="155.0" y="248.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">(ITU Radio Regulations 4.9)</text>
<text x="155.0" y="272.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">no power limit; any band;</text>
<text x="155.0" y="296.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">anyone may answer</text>
<rect x="310" y="15" width="280" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<ellipse cx="460.5" cy="155.0" rx="66.5" ry="5.4" fill="#000" fill-opacity="0.4"/>
<polygon points="400.0,80.0 500.0,80.0 521.0,66.5 421.0,66.5" fill="#f8bb54"/>
<rect x="400.0" y="80.0" width="100.0" height="70.0" fill="#f59e0b"/>
<rect x="400.0" y="80.0" width="100.0" height="70.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="500.0,150.0 500.0,80.0 521.0,66.5 521.0,136.5" fill="#865606"/>
<text x="450.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Emergency or disaster</text>
<text x="450.0" y="200.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">amateur stations only, carrying</text>
<text x="450.0" y="224.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">messages for people, governments,</text>
<text x="450.0" y="248.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">or relief organizations</text>
<text x="450.0" y="272.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">(Regulations s. 48)</text>
<text x="450.0" y="296.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">real or simulated</text>
<rect x="605" y="15" width="280" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<ellipse cx="755.5" cy="155.0" rx="66.5" ry="5.4" fill="#000" fill-opacity="0.4"/>
<polygon points="695.0,80.0 795.0,80.0 816.0,66.5 716.0,66.5" fill="#7ab7ea"/>
<rect x="695.0" y="80.0" width="100.0" height="70.0" fill="#4299e1"/>
<rect x="695.0" y="80.0" width="100.0" height="70.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="795.0,150.0 795.0,80.0 816.0,66.5 816.0,136.5" fill="#24547b"/>
<text x="745.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Everyone else</text>
<text x="745.0" y="200.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">keep the net frequency clear;</text>
<text x="745.0" y="224.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">avoid needless transmissions</text>
<text x="745.0" y="248.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">on or near it</text>
<text x="745.0" y="272.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">false distress calls are</text>
<text x="745.0" y="296.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">an offence (Act s. 9(1)(a))</text>
</svg>
