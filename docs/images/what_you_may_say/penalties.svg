<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two 3D bars of the maximum penalties for an individual under the Radiocommunication Act. Interfering, operating without authority, or a false distress call, under section 10(1): a fine of up to 5,000 dollars. Intercepting and divulging other people's radiocommunications, under section 9.1: up to 25,000 dollars. Each can also bring up to a year in prison, or both.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="380" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Maximum penalties for an individual, Radiocommunication Act</text>
<ellipse cx="269.0" cy="305.0" rx="75.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="200.0,265.0 310.0,265.0 338.0,247.0 228.0,247.0" fill="#f8bb54"/>
<rect x="200.0" y="265.0" width="110.0" height="35.0" fill="#f59e0b"/>
<rect x="200.0" y="265.0" width="110.0" height="35.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="310.0,300.0 310.0,265.0 338.0,247.0 338.0,282.0" fill="#865606"/>
<text x="270.0" y="239.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="bold">$5,000</text>
<text x="255.0" y="326.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Interfering, operating without authority,</text>
<text x="255.0" y="344.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">or a false distress call (s. 10(1))</text>
<ellipse cx="599.0" cy="305.0" rx="75.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="530.0,125.0 640.0,125.0 668.0,107.0 558.0,107.0" fill="#fca6a6"/>
<rect x="530.0" y="125.0" width="110.0" height="175.0" fill="#fc8181"/>
<rect x="530.0" y="125.0" width="110.0" height="175.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="640.0,300.0 640.0,125.0 668.0,107.0 668.0,282.0" fill="#8a4646"/>
<text x="600.0" y="99.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="bold">$25,000</text>
<text x="585.0" y="326.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Intercepting and divulging others'</text>
<text x="585.0" y="344.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">radiocommunications (s. 9.1)</text>
<text x="450.0" y="378.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">each: a fine up to this amount, up to a year in prison, or both</text>
</svg>
