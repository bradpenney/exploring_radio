<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three panels. A certificate holder at the controls transmits within their own privileges: allowed. A guest with a certificate holder present and supervising: allowed, under section 46 of the Regulations. A guest alone, with no holder present: not allowed, even on the holder's radio.</title>
