<circle cx="82" cy="125" r="7" fill="#48bb78"/>
<text x="99.0" y="130.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">talking with other amateur stations</text>
<circle cx="82" cy="167" r="7" fill="#48bb78"/>
<text x="99.0" y="172.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">codes that aren't secret (Q-codes,</text>
<text x="99.0" y="214.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">abbreviations, published digital modes)</text>
