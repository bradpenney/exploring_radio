<text x="672.0" y="52.0" font-size="16" fill="#fc9a9a" text-anchor="middle" font-weight="bold">Not allowed (Regulations s. 47, 49)</text>
<ellipse cx="682.5" cy="400.0" rx="186.5" ry="5.4" fill="#000" fill-opacity="0.4"/>
<polygon points="502.0,95.0 842.0,95.0 863.0,81.5 523.0,81.5" fill="#9b7575"/>
