<polygon points="842.0,395.0 842.0,95.0 863.0,81.5 863.0,381.5" fill="#3e1f1f"/>
<circle cx="527" cy="125" r="7" fill="#fc8181"/>
<text x="544.0" y="130.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">music, or commercially recorded material</text>
<circle cx="527" cy="167" r="7" fill="#fc8181"/>
<text x="544.0" y="172.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">programming from a broadcaster</text>
<circle cx="527" cy="209" r="7" fill="#fc8181"/>
<text x="544.0" y="214.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">business or professional traffic</text>
