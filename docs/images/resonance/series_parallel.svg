<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two graphs of impedance against frequency from 5 to 10 megahertz, for a 10 microhenry coil and a 50 picofarad capacitor. Series: the impedance dips sharply to its lowest at the 7.12 megahertz resonance, where the current is greatest, so the circuit passes that frequency. Parallel: the impedance peaks sharply at the same frequency, so the circuit blocks it.</title>
