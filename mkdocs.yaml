site_name: "Exploring Radio"
site_url: https://radio.bradpenney.io
site_description: "Amateur radio from first principles — the Canadian certificate exam, antennas, propagation, and getting on the air. Real numbers, no prior knowledge assumed."
site_author: Brad Penney
copyright: >-
  Copyright &copy; Brad Penney —
  <a href="#__consent">Change cookie settings</a>

extra:
  analytics:
    provider: google
    property: G-V01MJ4R3SQ
  consent:
    title: Cookie consent
    description: >-
      We use cookies to measure how effective our content is and whether you
      find what you're looking for. With your consent, you help make these
      learning sites better. You can change your choice at any time.
    cookies:
      analytics:
        name: Google Analytics
        checked: false
    actions:
      - accept
      - reject
      - manage
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bradpenney
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/bradpenney
    - icon: fontawesome/solid/globe
      link: https://bradpenney.io
    - icon: fontawesome/solid/rss
      link: https://radio.bradpenney.io/feed_rss_created.xml

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  custom_dir: overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    scheme: slate
    primary: black
    accent: amber
  logo: images/exploring_radio.png
  favicon: images/exploring_radio.png
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.code.highlight
    - content.tooltips
    - content.code.mermaid
    - navigation.path

plugins:
  - search
  - meta
  # - exclude:
  #     glob:
  #       - "draft_article.md"
  # Add the exclude plugin (uncommented) once draft articles exist — list
  # each draft path/glob here, matching the sibling exploring_* sites, then
  # remove the line as each article is published.
  - rss:
      match_path: ".*"
      pretty_print: true
      image: https://radio.bradpenney.io/images/exploring_radio.png
      abstract_chars_count: 160
      length: 20
      date_from_meta:
        as_creation: "date"
        as_update: "git"
        default_timezone: "America/Halifax"
      categories:
        - tags
      use_material_social_cards: false
  - social:
      cards: true
      cards_layout_options:
        background_color: "#1a202c"
        color: "#cbd5e0"
  - htmlproofer:
      enabled: true
      validate_rendered_template: true
      validate_external_urls: false
      raise_error: true
      raise_error_after_finish: true
      raise_error_excludes:
        404:
          - "#__consent"

markdown_extensions:
  - toc:
      permalink: "🔗"
      permalink_title: "Link to this section"
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Start Here: start_here.md

# Nav is topic-first — see CLAUDE.md for the full architecture. Add a topic
# block below once its first article exists; keep empty topics commented out.
# Practical Tools is a cross-cutting reference shelf, not a topic.
# The exam-section mapping (RIC-3 Basic syllabus) lives in CLAUDE.md.

  - Getting Licensed:
      - Overview: getting_licensed.md
      - Getting Your Certificate: getting_your_certificate.md
      - What You May Transmit: what_you_may_transmit.md
      - What You May Say: what_you_may_say.md
      - Across Borders: across_borders.md
      - Who Enforces the Rules: who_enforces_the_rules.md
      - Antennas and Neighbours: antennas_and_neighbours.md
  - Radio Fundamentals:
      - Overview: radio_fundamentals.md
      - What Is a Radio Wave?: what_is_a_radio_wave.md
      - Decibels: decibels.md
      - Reactance and Impedance: reactance_and_impedance.md
      - Resonance and Tuned Circuits: resonance.md
# - Antennas & Feedlines:
#     - Overview: antennas_overview.md
# - Propagation:
#     - Overview: propagation_overview.md
  - On the Air:
      - "The Amateur's Code: Ethics on the Air": amateurs_code.md
# - Station & Safety:
#     - Overview: station_safety_overview.md
# - Digital Modes & SDR:
#     - Overview: digital_modes_overview.md
  - Practical Tools:
      - ISED Basic Anki Deck: tools/ised_basic_anki_deck.md
