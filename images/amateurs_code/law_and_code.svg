<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two 3D books. The law, the Radiocommunication Act and RBR-4, enforced by ISED: identify at least every 30 minutes, stay inside your qualification's bands, no music, business, or secret codes. The codes, Wilson 1997 and Segal 1928, enforced by no one: listen before you transmit, slow down for a beginner, be ready to help in an emergency.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="790" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="410.0" y="48.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Two rulebooks: the one you must follow, and the one that keeps the bands worth using</text>
<ellipse cx="159.0" cy="185.0" rx="105.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="60.0,100.0 230.0,100.0 258.0,82.0 88.0,82.0" fill="#d66e6e"/>
<rect x="60.0" y="100.0" width="170.0" height="80.0" fill="#c53030"/>
<rect x="60.0" y="100.0" width="170.0" height="80.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="230.0,180.0 230.0,100.0 258.0,82.0 258.0,162.0" fill="#6c1a1a"/>
<text x="145.0" y="134.0" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">The law</text>
<text x="145.0" y="154.0" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal">Radiocommunication Act, RBR-4</text>
<text x="145.0" y="210.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold">enforced by ISED</text>
<text x="300.0" y="106.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">· identify at least every 30 minutes</text>
<text x="300.0" y="136.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">· stay inside your qualification's bands</text>
<text x="300.0" y="166.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">· no music, no business, no secret codes</text>
<ellipse cx="159.0" cy="335.0" rx="105.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="60.0,250.0 230.0,250.0 258.0,232.0 88.0,232.0" fill="#6da98b"/>
<rect x="60.0" y="250.0" width="170.0" height="80.0" fill="#2f855a"/>
<rect x="60.0" y="250.0" width="170.0" height="80.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="230.0,330.0 230.0,250.0 258.0,232.0 258.0,312.0" fill="#194931"/>
<text x="145.0" y="284.0" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">The codes</text>
<text x="145.0" y="304.0" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal">Wilson 1997, Segal 1928</text>
<text x="145.0" y="360.0" font-size="12" fill="#9ae6b4" text-anchor="middle" font-weight="bold">enforced by no one</text>
<text x="300.0" y="256.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">· listen before you transmit</text>
<text x="300.0" y="286.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">· slow down for a beginner</text>
<text x="300.0" y="316.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">· be ready to help in an emergency</text>
<text x="410.0" y="418.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">The law sets the floor. The codes describe the operator everyone hopes to meet on the air.</text>
</svg>
