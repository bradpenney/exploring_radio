<text x="450.0" y="216.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">feedline</text>
<text x="280.0" y="118.0" font-size="11" fill="#9f7aea" text-anchor="middle" font-weight="bold">trap</text>
<text x="620.0" y="118.0" font-size="11" fill="#9f7aea" text-anchor="middle" font-weight="bold">trap</text>
<text x="450.0" y="240.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">the traps are high impedance: only the inner wires radiate</text>
<text x="80.0" y="252.0" font-size="14" fill="#fbbf24" text-anchor="start" font-weight="bold">On a lower band</text>
<line x1="90" y1="290" x2="260" y2="290" stroke="#48bb78" stroke-width="5"/>
<line x1="300" y1="290" x2="430" y2="290" stroke="#48bb78" stroke-width="5"/>
<line x1="470" y1="290" x2="600" y2="290" stroke="#48bb78" stroke-width="5"/>
<line x1="640" y1="290" x2="810" y2="290" stroke="#48bb78" stroke-width="5"/>
<polygon points="260.0,276.0 300.0,276.0 312.6,267.9 272.6,267.9" fill="#bba1f0"/>
<rect x="260.0" y="276.0" width="40.0" height="28.0" fill="#9f7aea"/>
<rect x="260.0" y="276.0" width="40.0" height="28.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="300.0,304.0 300.0,276.0 312.6,267.9 312.6,295.9" fill="#574380"/>
