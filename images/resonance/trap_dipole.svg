<polygon points="640.0,304.0 640.0,276.0 652.6,267.9 652.6,295.9" fill="#574380"/>
<rect x="430" y="280" width="40" height="20" rx="4" fill="#4a5568"/>
<line x1="450" y1="300" x2="450" y2="340" stroke="#4a5568" stroke-width="4"/>
<text x="450.0" y="356.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">feedline</text>
<text x="280.0" y="258.0" font-size="11" fill="#9f7aea" text-anchor="middle" font-weight="bold">trap</text>
<text x="620.0" y="258.0" font-size="11" fill="#9f7aea" text-anchor="middle" font-weight="bold">trap</text>
<text x="450.0" y="380.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">the traps pass the current on: the whole wire radiates</text>
</svg>
