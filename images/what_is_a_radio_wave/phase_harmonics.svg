<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two panels. Phase: two sine waves of the same frequency, one shifted a quarter-cycle, 90 degrees, after the other; both complete a cycle in the same time. Harmonics: a 2 kilohertz fundamental, a 4 kilohertz second harmonic and a 6 kilohertz third harmonic, whole-number multiples of the fundamental; a transmitter on 7.1 megahertz can leak energy at 14.2 and 21.3 megahertz.</title>
