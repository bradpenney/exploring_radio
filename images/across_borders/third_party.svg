<text x="200.0" y="206.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">no certificate</text>
<circle cx="700" cy="120" r="13" fill="#4299e1"/>
<rect x="687" y="137" width="26" height="32" rx="10" fill="#4299e1"/>
<text x="700.0" y="188.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">foreign amateur</text>
<text x="700.0" y="206.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">certified: operator</text>
<circle cx="800" cy="120" r="13" fill="#fc8181"/>
<rect x="787" y="137" width="26" height="32" rx="10" fill="#fc8181"/>
<text x="800.0" y="188.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">their friend</text>
<text x="800.0" y="206.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">no certificate</text>
<rect x="150.0" y="219.0" width="100" height="26" rx="13.0" fill="#fc8181"/>
<rect x="150.0" y="219.0" width="100" height="26" rx="13.0" fill="url(#gloss)"/>
<text x="200.0" y="236.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">third party</text>
<rect x="750.0" y="219.0" width="100" height="26" rx="13.0" fill="#fc8181"/>
<rect x="750.0" y="219.0" width="100" height="26" rx="13.0" fill="url(#gloss)"/>
<text x="800.0" y="236.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">third party</text>
<text x="450.0" y="345.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Canada doesn't prohibit international third-party traffic (RBR-4 s. 6);</text>
<text x="450.0" y="365.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">the other country decides for its end. Personal, non-commercial content only.</text>
