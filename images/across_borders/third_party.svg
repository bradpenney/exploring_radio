<text x="110.0" y="206.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">certified: operator</text>
<circle cx="200" cy="120" r="13" fill="#fc8181"/>
<rect x="187" y="137" width="26" height="32" rx="10" fill="#fc8181"/>
