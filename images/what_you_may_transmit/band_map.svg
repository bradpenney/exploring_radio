<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Canada's amateur bands from 1.8 to 928 megahertz on a logarithmic frequency scale, from RBR-4 Schedule I. Below the 30 megahertz line, in green, the HF bands named by wavelength: 160, 80, 60, 40, 30, 20, 17, 15, 12 and 10 metres, which need Honours, Morse, or Advanced with Basic. Above it, in blue, the 6 metre, 2 metre, 1.25 metre, 70 centimetre and 33 centimetre bands, open to Basic. The microwave bands above 1 gigahertz continue off the right edge.</title>
