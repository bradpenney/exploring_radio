<text x="753.0" y="352.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">Advanced</text>
<text x="708.0" y="376.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">other modes, carrier power</text>
<text x="450.0" y="410.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">An amplifier may not be capable of more than 3 dB (twice) these limits (section 10.1).</text>
