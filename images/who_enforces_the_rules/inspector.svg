<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three panels on an inspector's powers under the Radiocommunication Act. Most places: an inspector may enter at a reasonable time with reasonable grounds to believe something relevant is there, examine, copy or remove it, under section 8(1), and seize equipment used to break the rules, under section 8.1. A home: no entry without the occupant's consent, except with a warrant from a justice of the peace, under sections 8(2) and 8(3), or when delay would endanger life or evidence. Force: only with a peace officer, and only when the warrant specifically authorizes it, under section 8(4). The person in charge must assist and answer reasonable requests, and must not obstruct or mislead the inspector.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="280" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="155.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Most places</text>
<ellipse cx="167.2" cy="145.0" rx="68.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="105.0,85.0 205.0,85.0 229.5,69.2 129.5,69.2" fill="#7ecfa0"/>
<rect x="105.0" y="85.0" width="100.0" height="55.0" fill="#48bb78"/>
<rect x="105.0" y="85.0" width="100.0" height="55.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="205.0,140.0 205.0,85.0 229.5,69.2 229.5,124.2" fill="#276642"/>
<rect x="40.0" y="164.0" width="230" height="28" rx="14.0" fill="#48bb78"/>
<rect x="40.0" y="164.0" width="230" height="28" rx="14.0" fill="url(#gloss)"/>
<text x="155.0" y="182.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">enter at a reasonable time</text>
<text x="155.0" y="228.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">with reasonable grounds</text>
<text x="155.0" y="254.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">to believe something relevant</text>
<text x="155.0" y="280.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">is there; examine, copy,</text>
<text x="155.0" y="306.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">or remove it (s. 8(1))</text>
<text x="155.0" y="332.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">seize equipment used to</text>
<text x="155.0" y="358.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">break the rules (s. 8.1)</text>
<rect x="310" y="15" width="280" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">A home</text>
<ellipse cx="462.2" cy="145.0" rx="68.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="400.0,85.0 500.0,85.0 524.5,69.2 424.5,69.2" fill="#f8bb54"/>
<rect x="400.0" y="85.0" width="100.0" height="55.0" fill="#f59e0b"/>
<rect x="400.0" y="85.0" width="100.0" height="55.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="500.0,140.0 500.0,85.0 524.5,69.2 524.5,124.2" fill="#865606"/>
<rect x="335.0" y="164.0" width="230" height="28" rx="14.0" fill="#f59e0b"/>
<rect x="335.0" y="164.0" width="230" height="28" rx="14.0" fill="url(#gloss)"/>
<text x="450.0" y="182.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">consent, or a warrant</text>
<text x="450.0" y="228.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">no entry without the</text>
<text x="450.0" y="254.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">occupant's consent, except</text>
<text x="450.0" y="280.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">with a warrant from a justice</text>
<text x="450.0" y="306.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">of the peace (s. 8(2)-(3))</text>
<text x="450.0" y="332.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">or when delay would</text>
<text x="450.0" y="358.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">endanger life or evidence</text>
<rect x="605" y="15" width="280" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="745.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Force</text>
<ellipse cx="757.2" cy="145.0" rx="68.2" ry="6.3" fill="#000" fill-opacity="0.4"/>
<polygon points="695.0,85.0 795.0,85.0 819.5,69.2 719.5,69.2" fill="#fca6a6"/>
<rect x="695.0" y="85.0" width="100.0" height="55.0" fill="#fc8181"/>
<rect x="695.0" y="85.0" width="100.0" height="55.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="795.0,140.0 795.0,85.0 819.5,69.2 819.5,124.2" fill="#8a4646"/>
<rect x="630.0" y="164.0" width="230" height="28" rx="14.0" fill="#fc8181"/>
<rect x="630.0" y="164.0" width="230" height="28" rx="14.0" fill="url(#gloss)"/>
<text x="745.0" y="182.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">only with a peace officer</text>
<text x="745.0" y="228.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">and only when the warrant</text>
<text x="745.0" y="254.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">specifically authorizes it</text>
<text x="745.0" y="280.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">(s. 8(4))</text>
<text x="745.0" y="306.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal"></text>
<text x="745.0" y="332.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">your side: assist, answer,</text>
<text x="745.0" y="358.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">don't obstruct or mislead (s. 8(5)-(6))</text>
</svg>
