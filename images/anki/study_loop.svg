<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Study loop: learn the idea, drill the cards, check you know why; correct answers get spaced out by Anki, guessed or wrong ones send you back to re-read the idea</title>
