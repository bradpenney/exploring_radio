<rect x="490.0" y="405.0" width="340" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="660.0" y="424.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">below it: the equipment's lack of immunity</text>
