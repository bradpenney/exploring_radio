<rect x="640.0" y="177.3" width="120.0" height="132.7" fill="#38b2ac"/>
<rect x="640.0" y="177.3" width="120.0" height="132.7" fill="url(#gloss)" opacity="0.6"/>
<polygon points="760.0,310.0 760.0,177.3 788.0,159.3 788.0,292.0" fill="#1e615e"/>
<text x="710.0" y="137.3" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="bold">3.16 V/m</text>
