<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A decision tree from CPC-2-0-03. A proposed new or modified antenna system is either excluded under section 6 (new and under 15 metres, a cumulative height increase of 25 percent or less, or temporary), in which case no consultation is needed, or it is not, in which case you contact the land-use authority. If the authority has a process, you follow it and it decides how consultation takes place; if it has none, you follow ISED's default process. If a stakeholder other than the general public reaches an impasse with you, ISED makes the final decision. Either way, Safety Code 6, EMCAB-2 and the other general requirements always apply.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a0aec0"/></marker></defs>
<rect x="15" y="15" width="870" height="490" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Which consultation does an antenna system need? (CPC-2-0-03)</text>
<polygon points="270.0,76.0 630.0,76.0 651.0,62.5 291.0,62.5" fill="#9a88be"/>
<rect x="270.0" y="76.0" width="360.0" height="34.0" fill="#6f55a3"/>
<rect x="270.0" y="76.0" width="360.0" height="34.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="630.0,110.0 630.0,76.0 651.0,62.5 651.0,96.5" fill="#3d2e59"/>
<text x="450.0" y="98.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Proposed new or modified antenna system</text>
<path d="M 360 125 L 200 180" stroke="#a0aec0" stroke-width="2" marker-end="url(#arr)" fill="none"/>
<text x="190.0" y="150.0" font-size="11" fill="#fbbf24" text-anchor="start" font-weight="bold">excluded (s. 6)</text>
<path d="M 540 125 L 700 180" stroke="#a0aec0" stroke-width="2" marker-end="url(#arr)" fill="none"/>
<text x="640.0" y="150.0" font-size="11" fill="#fbbf24" text-anchor="start" font-weight="bold">not excluded</text>
<polygon points="50.0,181.0 350.0,181.0 371.0,167.5 71.0,167.5" fill="#6fa787"/>
<rect x="50.0" y="181.0" width="300.0" height="34.0" fill="#328254"/>
<rect x="50.0" y="181.0" width="300.0" height="34.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="350.0,215.0 350.0,181.0 371.0,167.5 371.0,201.5" fill="#1b472e"/>
<text x="200.0" y="203.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">No consultation needed</text>
<text x="200.0" y="237.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">new and under 15 m; or a rise of 25% or less; or temporary</text>
<polygon points="550.0,181.0 850.0,181.0 871.0,167.5 571.0,167.5" fill="#6c97ba"/>
<rect x="550.0" y="181.0" width="300.0" height="34.0" fill="#2e6b9d"/>
<rect x="550.0" y="181.0" width="300.0" height="34.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="850.0,215.0 850.0,181.0 871.0,167.5 871.0,201.5" fill="#193a56"/>
<text x="700.0" y="203.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Contact the land-use authority</text>
<text x="700.0" y="237.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">the municipality or other local authority</text>
<path d="M 620 245 L 560 300" stroke="#a0aec0" stroke-width="2" marker-end="url(#arr)" fill="none"/>
<text x="430.0" y="280.0" font-size="11" fill="#fbbf24" text-anchor="start" font-weight="bold">it has a process</text>
<path d="M 780 245 L 800 300" stroke="#a0aec0" stroke-width="2" marker-end="url(#arr)" fill="none"/>
<text x="805.0" y="280.0" font-size="11" fill="#fbbf24" text-anchor="start" font-weight="bold">it has none</text>
<polygon points="415.0,301.0 665.0,301.0 686.0,287.5 436.0,287.5" fill="#6c97ba"/>
<rect x="415.0" y="301.0" width="250.0" height="34.0" fill="#2e6b9d"/>
<rect x="415.0" y="301.0" width="250.0" height="34.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="665.0,335.0 665.0,301.0 686.0,287.5 686.0,321.5" fill="#193a56"/>
<text x="540.0" y="323.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Follow its process</text>
<text x="540.0" y="357.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">it decides how to consult</text>
<polygon points="705.0,301.0 875.0,301.0 896.0,287.5 726.0,287.5" fill="#67a3a0"/>
<rect x="705.0" y="301.0" width="170.0" height="34.0" fill="#277c78"/>
<rect x="705.0" y="301.0" width="170.0" height="34.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="875.0,335.0 875.0,301.0 896.0,287.5 896.0,321.5" fill="#154442"/>
<text x="790.0" y="323.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">ISED default</text>
<text x="790.0" y="357.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">see the next figure</text>
<path d="M 700 365 L 620 415" stroke="#a0aec0" stroke-width="2" marker-end="url(#arr)" fill="none"/>
<text x="420.0" y="400.0" font-size="11" fill="#fbbf24" text-anchor="start" font-weight="bold">impasse with a stakeholder</text>
<polygon points="480.0,416.0 760.0,416.0 781.0,402.5 501.0,402.5" fill="#c49951"/>
<rect x="480.0" y="416.0" width="280.0" height="34.0" fill="#ab6e07"/>
<rect x="480.0" y="416.0" width="280.0" height="34.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="760.0,450.0 760.0,416.0 781.0,402.5 781.0,436.5" fill="#5e3c03"/>
<text x="620.0" y="438.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">ISED makes the final decision</text>
<text x="620.0" y="472.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">on request, not from the general public</text>
<text x="200.0" y="290.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Either way, Safety Code 6, EMCAB-2</text>
<text x="200.0" y="310.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">and the other general requirements</text>
<text x="200.0" y="330.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">(s. 7) always apply.</text>
</svg>
